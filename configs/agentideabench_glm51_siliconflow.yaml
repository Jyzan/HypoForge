# Separate generation condition: SiliconFlow GLM-5.1 + Qwen3 embeddings.
# Original GLM/Qwen3.6-Plus/Kimi critics are supplied separately at score time.
run_name: agentideabench-glm51-siliconflow
output_dir: ./output/agentideabench
verbose: false
interactive: false
advanced_model_tiers: false
run_mode: standard

# Preserve native deadlines for other stages; allow generation plus all M4 gates.
node_timeouts: {m1: 180, m2: 900, m3: 480, m4: 1200, m5: 1200, m6: 360}

pipeline:
  enabled_modules: [m1, m2, m3, m4, m5, m6]
  max_iterations: 3
  max_evidence_gap_rounds: 1
  enable_iteration: true
  iteration_module_target: m3

qwen:
  base: &glm
    model: Pro/zai-org/GLM-5.1
    api_base: https://api.siliconflow.cn/v1
    max_tokens: 8192
    temperature: 0.7
    enable_thinking: false
    seed: 42
    request_timeout_seconds: 180
    max_retries: 2
  max: *glm
  plus: *glm
  turbo: *glm

search:
  tools: [semantic_scholar, pubmed]
  papers_per_sub_question: 20
  max_papers_total: 100
  max_rounds: 3
  max_queries: 12
  max_tokens: 100000
  max_seconds: 900

entity_embedding_model: Qwen/Qwen3-Embedding-8B
evaluation:
  embedding:
    model_name: Qwen/Qwen3-Embedding-8B
    api_key_env_var: ENTITY_EMBEDDING_API_KEY
    base_url: https://api.siliconflow.cn/v1

module_overrides:
  m1:
    kwargs: {mode: llm, llm_tier: base}
  m2:
    kwargs: {variant: integrated, llm_tier: base}
  m3:
    kwargs: {mode: llm, llm_tier: base}
  m4:
    # Keep the seven-candidate portfolio; use smaller responses per request.
    kwargs:
      mode: multi_agent
      llm_tier: base
      num_candidates: 7
      top_k: 3
      generator_batch_size: 2
      epistemic_audit_batch_size: 2
      epistemic_audit_concurrency: 2
      total_time_budget_seconds: 900
      allow_continuity_fallback: false
  m5:
    kwargs:
      mode: llm
      llm_tier: base
      validation_timeout_seconds: 120
      validation_batch_size: 3
      validation_concurrency: 2
      validation_max_tokens: 2048
  m6:
    kwargs:
      mode: llm
      llm_tier: base
      reviewers: [scientific_logic, objective_evidence_consistency, method_feasibility, overall]
      reviewer_concurrency: 3
      reviewer_max_tokens: 2048

scoring:
  auto_score: false
memory_cache_dir: ""
enabled_skills: []
