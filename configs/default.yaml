# HypoForge — Default Pipeline Configuration
# Used when no --config flag is given.

run_name: hypoforge-default
output_dir: ./output
verbose: true
log_level: INFO

pipeline:
  enabled_modules: ["m1", "m2", "m3", "m4", "m5", "m6"]
  max_iterations: 3
  max_evidence_gap_rounds: 1
  enable_iteration: true
  iteration_module_target: "m3"

qwen:
  base:
    model: qwen3.7-max
    max_tokens: 16384
    temperature: 0.1
  max:
    model: qwen3.7-max
    max_tokens: 16384
    temperature: 0.1
  plus:
    model: qwen3.7-plus
    max_tokens: 8192
    temperature: 0.1
  turbo:
    model: qwen3.6-flash
    max_tokens: 8192
    temperature: 0.3

search:
  tools: ["semantic_scholar", "pubmed"]
  papers_per_sub_question: 15
  max_papers_total: 80

module_overrides:
  m1:
    kwargs:
      mode: "llm"
      llm_tier: "base"
  m2:
    kwargs:
      mode: "llm"
      llm_tier: "turbo"
      max_papers_per_query: 10
      batch_size: 5
  m3:
    kwargs:
      mode: "llm"
      llm_tier: "plus"
  m4:
    kwargs:
      mode: "direct"
      llm_tier: "base"
      num_candidates: 5
      top_k: 3
  m5:
    kwargs:
      mode: "llm"
      llm_tier: "plus"
  m6:
    kwargs:
      mode: "llm"
      llm_tier: "plus"

enabled_skills: []

memory_cache_dir: "./knowledge_graph"
