# HypoForge — Default Pipeline Configuration
# Full M1-M6 pipeline with iteration; used when no --config flag is given.

run_name: hypoforge-default
output_dir: ./output
verbose: true
log_level: INFO

pipeline:
  enabled_modules: ["m1", "m2", "m3", "m4", "m5", "m6"]
  max_iterations: 3
  max_evidence_gap_rounds: 1
  enable_iteration: true
  iteration_module_target: "m3"

qwen:
  base:
    model: qwen3.7-max-2026-06-08
    max_tokens: 8192
    temperature: 0.1
  max:
    model: qwen3.7-max-2026-06-08
    max_tokens: 8192
    temperature: 0.1
  plus:
    model: qwen3.7-plus
    max_tokens: 4096
    temperature: 0.1
  turbo:
    model: qwen3.6-flash
    max_tokens: 4096
    temperature: 0.3

search:
  tools: ["semantic_scholar", "pubmed"]
  papers_per_sub_question: 20
  max_papers_total: 100

# Entity normalization embedding (set model name to enable; empty = lexical-only).
# Endpoint read from ENTITY_EMBEDDING_BASE_URL / ENTITY_EMBEDDING_API_KEY env vars.
entity_embedding_model: "text-embedding-v3"

module_overrides:
  m1:
    kwargs:
      mode: "llm"
      llm_tier: "base"
  m2:
    kwargs:
      llm_tier: "turbo"
  m3:
    kwargs:
      mode: "llm"
      llm_tier: "plus"
  m4:
    kwargs:
      mode: "multi_agent"
      llm_tier: "base"
      num_candidates: 7
      top_k: 3
  m5:
    kwargs:
      mode: "llm"
      llm_tier: "plus"
  m6:
    kwargs:
      mode: "llm"
      llm_tier: "plus"
      reviewers: ["scientific_logic", "method_feasibility", "overall"]

enabled_skills: []

memory_cache_dir: "./knowledge_graph"
