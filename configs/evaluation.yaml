evaluation:
  embedding:
    model_name: "text-embedding-v3"
    api_key_env_var: "DASHSCOPE_API_KEY"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  novelty:
    # We will use simple BM25 keyword mapping, so no embedding threshold needed here.
    pass
  consistency:
    # Cosine similarity threshold for deciding if a graph node threatens the claim
    similarity_threshold: 0.8
