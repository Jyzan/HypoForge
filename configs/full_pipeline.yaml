# HypoForge — Full Pipeline (all six modules + iteration)

run_name: hypoforge-full
output_dir: ./output/full_pipeline
verbose: true
log_level: INFO

pipeline:
  enabled_modules: ["m1", "m2", "m3", "m4", "m5", "m6"]
  max_iterations: 3
  max_evidence_gap_rounds: 1
  enable_iteration: true
  iteration_module_target: "m3"

qwen:
  base:
    model: qwen3.7-max
    max_tokens: 8192
    temperature: 0.1
  max:
    model: qwen3.7-max
    max_tokens: 8192
    temperature: 0.1
  plus:
    model: qwen3.7-plus
    max_tokens: 4096
    temperature: 0.1
  turbo:
    model: qwen3.6-flash
    max_tokens: 4096
    temperature: 0.3

search:
  tools: ["semantic_scholar", "pubmed"]
  papers_per_sub_question: 20
  max_papers_total: 100

entity_embedding_model: "text-embedding-v3"

module_overrides:
  m1:
    kwargs:
      mode: "llm"
      llm_tier: "base"
  m2:
    kwargs:
      mode: "llm"
      llm_tier: "turbo"
      max_papers_per_query: 15
      batch_size: 5
  m3:
    kwargs:
      mode: "llm"
      llm_tier: "plus"
  m4:
    kwargs:
      num_candidates: 7
      top_k: 3
      mode: "multi_agent"
      llm_tier: "base"
  m5:
    kwargs:
      mode: "llm"
      llm_tier: "plus"
  m6:
    kwargs:
      mode: "llm"
      llm_tier: "plus"
      reviewers: ["scientific_logic", "evidence_consistency", "method_feasibility", "overall"]

enabled_skills: []
