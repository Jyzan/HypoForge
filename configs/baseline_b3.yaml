# HypoForge — Baseline B3: B2 + Multi-Agent Hypothesis Generation
# Full M1-M5 pipeline with multi-agent M4 (Generator-Critic-Ranker),
# but WITHOUT iteration (M6 disabled).

run_name: baseline-b3
output_dir: ./output/baseline_b3
verbose: true
log_level: INFO

pipeline:
  enabled_modules: ["m1", "m2", "m3", "m4", "m5"]
  max_iterations: 0
  enable_iteration: false

qwen:
  max:
    model: qwen-max
    max_tokens: 8192
    temperature: 0.1
  plus:
    model: qwen-plus
    max_tokens: 4096
    temperature: 0.1

search:
  tools: ["semantic_scholar", "pubmed"]
  papers_per_sub_question: 15
  max_papers_total: 60

module_overrides:
  m4:
    kwargs:
      num_candidates: 7
      top_k: 3
      mode: "multi_agent"

enabled_skills: []
