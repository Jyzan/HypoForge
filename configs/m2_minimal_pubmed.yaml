# HypoForge — Minimal PubMed-only Agentic M2 (no LLM required)
# Uses rule-based query planning, dedup, ranking, and abstract reading.

run_name: hypoforge-m2-minimal
output_dir: ./output/m2_minimal
verbose: true
log_level: INFO

pipeline:
  enabled_modules: ["m1", "m2"]
  max_iterations: 1
  enable_iteration: false

qwen:
  base:
    model: qwen3.7-max
    max_tokens: 8192
    temperature: 0.1
  max:
    model: qwen3.7-max
    max_tokens: 8192
    temperature: 0.1
  plus:
    model: qwen3.7-plus
    max_tokens: 4096
    temperature: 0.1
  turbo:
    model: qwen3.6-flash
    max_tokens: 4096
    temperature: 0.3

search:
  implementation: agentic
  tools: ["pubmed"]
  papers_per_sub_question: 5
  max_papers_total: 10

module_overrides:
  m1:
    kwargs:
      mode: "llm"
      llm_tier: "base"
  m2:
    kwargs:
      variant: minimal
      llm_tier: "turbo"
      final_k: 5
      source_timeout_seconds: 30.0

enabled_skills: []
