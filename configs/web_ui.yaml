# Live M1-M6 configuration for the combined Track A Agentic M2.

run_name: hypoforge-m2-live-qwen37plus
output_dir: ./output/m2_live_qwen37plus
verbose: true
log_level: INFO

pipeline:
  enabled_modules: ["m1", "m2", "m3", "m4", "m5", "m6"]
  max_iterations: 2
  max_evidence_gap_rounds: 1
  enable_iteration: true
  iteration_module_target: "m3"
  followup_routing: true
  m6_evidence_revisit: true
  max_search_rounds: 2
  supplement_paper_budget: 6
  gap_no_improvement_limit: 3

# Calibrated from live-run latency and no-timeout replays. M1 performs many
# bounded LLM calls in sequence; a 2026-08-24 standard run reached its normal
# entity-repair stage but was incorrectly cancelled by the old 240s shared
# deadline. Keep each provider request bounded and remove only M1's aggregate
# deadline. The reasoning-enabled M4 generator completed naturally in 282.35s,
# so its layered ceilings retain additional headroom.
node_timeouts:
  m1: 0.0
  m2: 900.0
  m3: 480.0
  m4: 900.0
  m5: 180.0
  m6: 180.0

qwen:
  base:
    model: qwen3.7-plus
    max_tokens: 4096
    temperature: 0.1
    request_timeout_seconds: 210.0
  max:
    model: qwen3.7-plus
    max_tokens: 4096
    temperature: 0.1
    request_timeout_seconds: 210.0
  plus:
    model: qwen3.7-plus
    max_tokens: 4096
    temperature: 0.1
    request_timeout_seconds: 330.0
  turbo:
    model: qwen3.7-plus
    max_tokens: 4096
    temperature: 0.1
    request_timeout_seconds: 210.0

search:
  implementation: agentic
  tools:
    - serper_openalex
    - openalex
    - openalex_oa
    - pubmed
    - arxiv
    - crossref
    - europe_pmc
    - zbmath
    - inspire
    - ads
    - dblp
    - osti
    - ntrs
  papers_per_sub_question: 6
  max_papers_total: 60
  max_rounds: 2
  max_queries: 16
  max_tokens: 30000
  max_seconds: 180

entity_embedding_model: "text-embedding-v3"

module_overrides:
  m1:
    kwargs:
      mode: "llm"
      llm_tier: "base"
      coverage_max_rounds: 2
      entity_repair_attempts: 1
      requirement_repair_attempts: 1
      followup_triage_confidence_threshold: 0.75
  m2:
    kwargs:
      variant: integrated
      llm_tier: "plus"
      domain_routing_enabled: true
      access_enrichment_timeout_seconds: 12.0
      fulltext_target_per_subquestion: 2
      fulltext_backfill_max_attempts: 4
      # Last-resort additive discovery for Science-125 domain preprint
      # servers. Existing discovery/OA/full-text paths always run first.
      preprint_supplement_enabled: true
      preprint_supplement_max_sources: 2
      preprint_supplement_per_source_limit: 2
      preprint_supplement_max_candidates: 4
      preprint_supplement_max_attempts: 2
      preprint_supplement_timeout_seconds: 15.0
      preprint_supplement_scout_timeout_seconds: 60.0
      final_k: 2
      subquestion_concurrency: 2
      source_concurrency_limit: 2
      fresh_run_timeout_seconds: 840.0
      source_timeout_seconds: 30.0
      scout_timeout_seconds: 60.0
      scout_candidate_limit: 24
      arxiv_download_timeout_seconds: 90.0
      resolver_timeout_seconds: 90.0
      reader_timeout_seconds: 75.0
      reading_workflow_timeout_seconds: 180.0
  m3:
    kwargs:
      mode: "llm"
      llm_tier: "plus"
      entity_merge_enabled: true
      entity_merge_similarity_threshold: 0.92
  m4:
    kwargs:
      num_candidates: 3
      top_k: 1
      mode: "multi_agent"
      llm_tier: "plus"
      llm_call_timeout: 360.0
      total_time_budget_seconds: 840.0
      semantic_alignment_timeout_seconds: 45.0
  m5:
    kwargs:
      mode: "llm"
      llm_tier: "plus"
      generation_timeout_seconds: 180.0
      semantic_alignment_timeout_seconds: 60.0
  m6:
    kwargs:
      mode: "llm"
      llm_tier: "plus"
      semantic_alignment_timeout_seconds: 60.0
      reviewer_timeout_seconds: 180.0
      reviewers:
        - scientific_logic
        - method_feasibility
        - overall

enabled_skills: []

# Persistent paper/query cache used by M2 supplement rounds and M3 memory.
memory_cache_dir: "./knowledge_graph"
