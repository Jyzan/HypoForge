# HypoForge — Baseline B2: B1 + Structured Knowledge Extraction
# M2 + M3 enabled (literature search + evidence graph).
# M4 still uses single-agent mode (no Generator-Critic-Ranker chain).

run_name: baseline-b2
output_dir: ./output/baseline_b2
verbose: true
log_level: INFO

pipeline:
  enabled_modules: ["m1", "m2", "m3", "m4", "m5"]
  max_iterations: 0
  enable_iteration: false

qwen:
  max:
    model: qwen-max
    max_tokens: 8192
    temperature: 0.1

search:
  tools: ["semantic_scholar", "pubmed"]
  papers_per_sub_question: 15
  max_papers_total: 60

module_overrides:
  m4:
    kwargs:
      num_candidates: 5
      top_k: 3
      mode: "direct"  # single agent, not multi-agent

enabled_skills: []
